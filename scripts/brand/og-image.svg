<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </radialGradient>
    <linearGradient id="ogBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle Grid Accent -->
  <path d="M0 150H1200 M0 300H1200 M0 450H1200 M300 0V630 M600 0V630 M900 0V630" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" fill="none" />

  <!-- Center Card Area -->
  <g transform="translate(140, 140)">
    <!-- Symbol -->
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#ogBrandGrad)" />
    <path d="M26 70V30L48 52L70 30V70" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48" cy="52" r="4.5" fill="#38BDF8" />

    <!-- Badges -->
    <rect x="120" y="8" width="130" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="185" y="28" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">AGY WORKSPACE</text>

    <!-- Main Title -->
    <text x="0" y="170" font-family="Pretendard, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1">마케팅 업무실</text>
    <text x="0" y="225" font-family="Pretendard, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">클라이언트 프로필 · 로고 브리프 · 스마트 견적서 원스톱 B2B 솔루션</text>

    <!-- Value Props Badges -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="220" height="40" rx="8" fill="#131B2E" stroke="#24334A" />
      <text x="110" y="25" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">✔ 실시간 1원 단위 세액 계산</text>

      <rect x="235" y="0" width="220" height="40" rx="8" fill="#131B2E" stroke="#24334A" />
      <text x="345" y="25" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">✔ 고해상도 A4 견적서 PDF</text>

      <rect x="470" y="0" width="200" height="40" rx="8" fill="#131B2E" stroke="#24334A" />
      <text x="570" y="25" font-family="Pretendard, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">✔ 데이터 불변 승인 보존</text>
