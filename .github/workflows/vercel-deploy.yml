# 운영 배포(DEPLOY-ACTIONS-01, 주인님 2026-11-19 결정 DEC-PREP-05 (다)).
# Vercel Hobby는 맨 위 커밋 작성자가 계정 소유자여야 Git 자동 배포를 해 준다. AI 커밋은 그래서 막힌다.
# 이 워크플로는 주인님 토큰으로 Vercel CLI 배포를 한다(배포 주체 = 토큰 주인, 커밋 작성자와 무관).
# - 실행: GitHub 저장소 Actions → vercel-deploy → Run workflow(main 브랜치, 대상 선택). 수동 실행만 받는다.
# - 처음에는 preview(미리보기)로 한 번 시험한다. 작성자 확인에 걸리지 않는지 본 뒤 production(운영)을 쓴다.
# - 비밀값: 저장소 Secrets 의 VERCEL_TOKEN·VERCEL_ORG_ID·VERCEL_PROJECT_ID(주인님이 직접 넣는다).
#   토큰은 명령 인자(--token)로 넘기지 않는다. 명령 인자는 로그·프로세스 목록에 남을 수 있다(Vercel 외부 파이프라인 문서).
# - main 이 아닌 브랜치를 골라 돌리면 배포 작업을 건너뛴다. pull_request 계열로는 돌지 않는다(비밀값 보호).
# - Vercel CLI 버전 고정: vercel@65.11.0(2026-11-03 배포, npm 등록소 조회 2026-11-19).
# - 자세한 절차·되돌리기: docs/deploy-actions.md
name: vercel-deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상: preview(미리보기·시험) 또는 production(운영)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

# 배포는 한 번에 하나만. 앞의 배포를 도중에 끊지 않는다.
concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@65.11.0
      # 입력값은 스크립트 안에 직접 끼워 넣지 않고 환경 변수로만 넘긴다.
      TARGET: ${{ inputs.target }}
    steps:
      - name: 비밀값 3개가 있는지 확인
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::저장소 Secrets 에 없는 값:$missing (docs/deploy-actions.md 1절)"
            exit 1
          fi
          case "$TARGET" in
            preview|production) ;;
            *) echo "::error::배포 대상은 preview 또는 production 만 됩니다"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 잠금 파일 그대로 설치하고, 배포 전에 형식검사·린트·단위/DB 시험을 한 번 더 돈다.
      - run: npm ci
      - run: npm run verify

      - name: Vercel 환경 설정 내려받기
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="$TARGET"

      - name: 빌드
        run: |
          if [ "$TARGET" = production ]; then
            npx --yes "$VERCEL_CLI" build --prod
          else
            npx --yes "$VERCEL_CLI" build
          fi

      - name: 배포
        run: |
          if [ "$TARGET" = production ]; then
            url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod)
          else
            url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt)
          fi
          echo "배포 주소: $url"
          {
            echo "### Vercel 배포 ($TARGET)"
            echo ""
            echo "- 커밋: \`$GITHUB_SHA\`"
            echo "- 주소: $url"
          } >> "$GITHUB_STEP_SUMMARY"
